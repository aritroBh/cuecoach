[project]
name = "cuecoach-tablekeypoints"
version = "0.1.0"
description = "Synthetic-first YOLO pose training for pool-table calibration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coremltools==8.3.0",
    "numpy>=1.26,<2",
    "opencv-python>=4.10,<4.12",
    "pillow>=10.4,<13",
    "pyyaml>=6,<7",
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "ultralytics==8.4.203",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
